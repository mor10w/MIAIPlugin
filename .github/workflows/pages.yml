# Hoster add-in'et statisk på GitHub Pages (direkte forbindelse, ADR-0007) og
# publicerer færdige manifester på <pages-url>/manifest.xml og <pages-url>/manifest-outlook.xml.
# Kræver: Settings → Pages → Source: "GitHub Actions".
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build -w @miai/shared && npm run build -w @miai/addin
      - run: node scripts/make-manifest.mjs hosted "${{ steps.pages.outputs.base_url }}/" packages/addin/dist/manifest.xml
      - run: node scripts/make-manifest.mjs hosted "${{ steps.pages.outputs.base_url }}/" packages/addin/dist/manifest-outlook.xml outlook
      # MIAI App: installationsfiler og opdateringsfeed (latest*.yml) fra seneste release (#5, ADR-0016).
      # Opdateringsfeedet har en fast adresse her (build.publish), som er bygget ind i alle installerede
      # udgaver. Det var oprindeligt nødvendigt, fordi repoet var privat; det er nu offentligt, men
      # feedet bliver her, så installerede udgaver fortsat finder opdateringer.
      - name: Downloads og opdateringsfeed fra seneste release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packages/addin/dist/updates
          gh release download --repo "$GITHUB_REPOSITORY" --dir packages/addin/dist/updates \
            --pattern '*.yml' --pattern '*.zip' --pattern '*.exe' --pattern '*.dmg' --pattern '*.blockmap' \
            || echo "Ingen release endnu – ingen downloads eller opdateringer."
      # Udviklerudgaven (dev-build.yml): den rullende forhåndsudgivelse "dev" serveres under /dev/,
      # hvor appens menupunkt "Hent udviklerudgave" læser dev.json, og Windows-udviklerudgaven opdaterer
      # sig selv fra dev.yml. "Seneste release" ovenfor omfatter ikke forhåndsudgivelser, så de to
      # blandes ikke.
      - name: Udviklerudgave fra forhåndsudgivelsen "dev"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dev"
          if gh release download dev --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/dev" --pattern 'dev.json' --pattern 'dev.yml' --pattern '*.dmg' --pattern '*.exe' --pattern '*.blockmap'; then
            mv "$RUNNER_TEMP/dev" packages/addin/dist/dev
          else
            echo "Ingen udviklerudgave endnu."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/addin/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
