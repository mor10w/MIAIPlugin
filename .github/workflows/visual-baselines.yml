name: Visuelle baselines

# Genererer snapshots til e2e/visual.spec.ts i samme miljø som CI's e2e-job (ubuntu-latest,
# samme Chromium), så skrifttype-rendering og kantudglatning matcher. Køres manuelt efter
# bevidste UI-ændringer: Actions → "Visuelle baselines" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx -w @miai/addin playwright install --with-deps chromium
      - run: npm run test:e2e -- visual.spec.ts --update-snapshots
      - name: Commit nye baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/addin/e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then echo "Ingen ændringer."; exit 0; fi
          git commit -m "Opdatér visuelle baselines fra CI"
          git push
