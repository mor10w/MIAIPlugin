name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Kodekvalitet (#14): ESLint (inkl. typebevidste regler) og Prettier.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typebevidste regler kræver de byggede typer fra @miai/shared.
      - run: npm run build -w @miai/shared
      - run: npm run lint
      - run: npm run format:check

  # Browsertests af task pane (#10): Chromium + simuleret Office.js + mock-model.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Samme Playwright-version som @playwright/test i packages/addin.
      - run: npx -w @miai/addin playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-resultater
          path: |
            packages/addin/test-results/
            packages/addin/playwright-report/
          retention-days: 14
