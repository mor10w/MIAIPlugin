# Udviklerudgave af MIAI App (ADR-0016, tillæg): hvert push til main, der rører appen, bygger en
# .dmg til Apple Silicon og en installer til Windows (x64, #40) og lægger dem som den rullende
# forhåndsudgivelse "dev". Pages kopierer den til <pages-url>/dev/, hvor appens menupunkt
# "Hent udviklerudgave" finder den via dev.json, og hvor en installeret Windows-udviklerudgave
# opdaterer sig selv fra dev.yml (electron-updater).
#
#   Version: <version i packages/app/package.json>-dev.<kørselsnummer>, fx 0.1.0-dev.42 (intet git-tag).
#   Signering: Mac ad hoc (intet certifikat) – Gatekeeper skal godkende appen ved første start.
#              Windows usigneret – SmartScreen advarer, indtil Azure Trusted Signing er sat op (#67).
#
# De rigtige udgivelser (tag v*) laves stadig af release.yml.
name: Udviklerudgave
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "!packages/evals/**"
      - "!packages/addin/e2e/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dev-build.yml"
  # På en pull request bygges der kun (ingen udgivelse), og kun når selve pakningen er ændret.
  pull_request:
    paths:
      - ".github/workflows/dev-build.yml"
      - "packages/app/package.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Kun det nyeste push bygges.
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Én version til begge platforme.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packages/app/package.json
          sparse-checkout-cone-mode: false
      - id: version
        run: |
          base=$(node -p "require('./packages/app/package.json').version")
          version="$base-dev.$GITHUB_RUN_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Udviklerversion: $version"

  mac:
    needs: version
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sæt udviklerversion
        working-directory: packages/app
        run: npm pkg set version="${{ needs.version.outputs.version }}"
      - name: Byg .dmg (Apple Silicon, ad hoc-signeret)
        working-directory: packages/app
        env:
          # electron-builder springer signering over på pull requests; ad hoc-signering bruger ingen hemmeligheder.
          CSC_FOR_PULL_REQUEST: true
        run: |
          npm run icons
          npm run notices
          # Ad hoc-signatur ("-"): Apple Silicon kræver en gyldig signatur for at starte appen.
          # Hardened runtime slås fra, da den uden et Team ID afviser Electrons egne biblioteker.
          npx electron-builder --mac dmg --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
      - name: Kontrollér signaturen
        run: |
          app="packages/app/dist/mac-arm64/MIAI.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q "Signature=adhoc" "$RUNNER_TEMP/codesign.txt"
      - name: Kontrollér, at licenserne følger med
        run: |
          res="packages/app/dist/mac-arm64/MIAI.app/Contents/Resources"
          for f in LICENSE.txt THIRD-PARTY-NOTICES.txt addin/LICENSE.txt addin/THIRD-PARTY-NOTICES.txt; do
            test -s "$res/$f" || { echo "::error::$f mangler i appen"; exit 1; }
          done
          grep -q "ManInfo ApS" "$res/LICENSE.txt"
          grep -c "^Licens: " "$res/THIRD-PARTY-NOTICES.txt" "$res/addin/THIRD-PARTY-NOTICES.txt"
          ls "$res/.." | grep -i "licens" || true
          /usr/libexec/PlistBuddy -c "Print :NSHumanReadableCopyright" "$res/../Info.plist"
      - name: Kontrollér, at appen starter
        run: |
          log="$HOME/Library/Application Support/MIAI/MIAI.log"
          bin="packages/app/dist/mac-arm64/MIAI.app/Contents/MacOS/MIAI"
          MIAI_NO_UPDATES=1 "$bin" > "$RUNNER_TEMP/first.txt" 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            if grep -q "bridge-process: lytter" "$log" 2>/dev/null; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          ok=0
          grep -q "bridge-process: lytter" "$log" 2>/dev/null && ok=1
          # En anden instans skal lukke hurtigt, og den kørende skal opdage den
          # (i stedet for at den nye lukker – eller hænger – uden et ord).
          second=0
          closed=1
          if [ "$ok" = 1 ]; then
            MIAI_NO_UPDATES=1 "$bin" > "$RUNNER_TEMP/second.txt" 2>&1 &
            pid2=$!
            for _ in $(seq 1 20); do
              if ! kill -0 "$pid2" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$pid2" 2>/dev/null; then closed=0; kill "$pid2" 2>/dev/null || true; fi
            sleep 2
            grep -q "anden instans startet" "$log" 2>/dev/null && second=1
          fi
          echo "--- processer"; ps -axo pid,ppid,etime,command | grep -i "MIAI" | grep -v grep || true
          echo "--- MIAI.log"; cat "$log" 2>/dev/null || echo "(ingen log)"
          echo "--- første instans"; cat "$RUNNER_TEMP/first.txt" 2>/dev/null || true
          echo "--- anden instans"; cat "$RUNNER_TEMP/second.txt" 2>/dev/null || true
          kill "$pid" 2>/dev/null || true
          if [ "$ok" != 1 ]; then echo "::error::Appen startede ikke bridgen inden for et minut"; exit 1; fi
          if [ "$closed" != 1 ]; then echo "::error::Den anden instans lukkede ikke inden for 20 sekunder"; exit 1; fi
          if [ "$second" != 1 ]; then echo "::error::Den kørende app opdagede ikke, at en anden instans blev startet"; exit 1; fi
      - name: Saml filer
        run: |
          mkdir out
          cp packages/app/dist/*.dmg out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: miai-dev-mac
          path: out/
          retention-days: 14

  win:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sæt udviklerversion
        working-directory: packages/app
        run: npm pkg set version="${{ needs.version.outputs.version }}"
      - name: Byg installer (Windows x64, usigneret)
        working-directory: packages/app
        run: |
          npm run icons
          npm run notices
          npx electron-builder --win nsis --x64 --publish never
      - name: Kontrollér, at licenserne følger med
        run: |
          res="packages/app/dist/win-unpacked/resources"
          for f in LICENSE.txt THIRD-PARTY-NOTICES.txt addin/LICENSE.txt addin/THIRD-PARTY-NOTICES.txt; do
            test -s "$res/$f" || { echo "::error::$f mangler i appen"; exit 1; }
          done
          grep -q "ManInfo ApS" "$res/LICENSE.txt"
          grep -c "^Licens: " "$res/THIRD-PARTY-NOTICES.txt" "$res/addin/THIRD-PARTY-NOTICES.txt"
      - name: Saml filer
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir out
          exe="MIAI-Setup-$VERSION-x64.exe"
          cp "packages/app/dist/$exe" "packages/app/dist/$exe.blockmap" out/
          # Udviklerkanalen: en installeret Windows-udviklerudgave opdaterer sig selv fra dev.yml
          # (electron-updater, kanal "dev"). electron-builder skriver selv dev.yml i stedet for
          # latest.yml, fordi versionen har prerelease-mærket "dev" (0.1.0-dev.42), så det aldrig
          # kan forveksles med de almindelige udgivelsers feed.
          cp packages/app/dist/dev.yml out/dev.yml
          cat out/dev.yml
          grep -qx "version: $VERSION" out/dev.yml || { echo "::error::dev.yml har ikke version $VERSION"; exit 1; }
          grep -qx "path: $exe" out/dev.yml || { echo "::error::dev.yml peger ikke på $exe"; exit 1; }
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: miai-dev-win
          path: out/
          retention-days: 14

  publish:
    # Begge platforme skal være bygget: den rullende udgivelse erstattes, så en manglende platform
    # ville forsvinde fra /dev/ indtil næste push.
    needs: [version, mac, win]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # den rullende forhåndsudgivelse "dev"
      actions: write # starte Pages
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: miai-dev-*
          merge-multiple: true
          path: out
      - name: dev.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dmg=$(cd out && ls *.dmg)
          exe=$(cd out && ls *.exe)
          # files: ét filnavn pr. platform (devBuild.js læser det). file: Mac-dmg'en til udviklerudgaver
          # fra før #40, som kun kender det felt.
          node -e '
            const [version, dmg, exe, commit] = process.argv.slice(1);
            const info = { version, files: { "darwin-arm64": dmg, "win32-x64": exe }, file: dmg, commit, date: new Date().toISOString() };
            process.stdout.write(JSON.stringify(info, null, 2) + "\n");
          ' "$VERSION" "$dmg" "$exe" "$GITHUB_SHA" > out/dev.json
          cat out/dev.json
          ls -la out
      - name: Forhåndsudgivelsen "dev"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Én rullende udgivelse: den gamle (og dens tag) erstattes, så der altid kun ligger den nyeste.
          gh release delete dev --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || echo "Ingen tidligere udviklerudgave."
          gh release create dev out/* --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "MIAI udviklerudgave $VERSION" \
            --notes "Bygget automatisk fra main (${GITHUB_SHA::7}). macOS på Apple Silicon (ad hoc-signeret) og Windows x64 (usigneret). Erstattes ved næste push – brug en rigtig udgivelse (v*) til andet end afprøvning."
      - name: Opdatér Pages (/dev/)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
