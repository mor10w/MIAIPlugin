# Automatisk version-bump og release ved push til main (ADR-0016, tillæg 2).
#
# Hvert push til main, der rører app-koden (samme filtre som dev-build.yml), udgiver
# en ny release, så klienter med MIAI App får opdateringer uden ceremoni:
#   - Ændrer push'et versionen i packages/app/package.json selv, udgives den præcist
#     (fx 0.2.0), så man stadig kan styre minor/major manuelt.
#   - Ellers bumpes patch-versionen automatisk (fx 0.1.2 → 0.1.3).
# Bump-committen pushes til main og tagges v<version>, som trigget release.yml.
# Et tip, der allerede har sit tag (fx en bump-commit), udløser intet nyt release.
#
#   Actions → Auto-release → Run workflow        → udgiver nuværende main (manuel genkørsel)
name: Auto-release

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "!packages/evals/**"
      - "!packages/addin/e2e/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

# Kørsler skal være sekventielle, så to push'er ikke bumper over hinanden.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Altid udgiv fra seneste tip på main, så push'er der lander undervejs
          # ender i samme release frem for at skabe en dobbelt-bump.
          ref: main
          fetch-depth: 0

      - name: Afgør, om der skal udgives noget
        id: decide
        run: |
          set -euo pipefail
          V=$(node -p "require('./packages/app/package.json').version")

          if git tag --points-at HEAD | grep -qx "v$V"; then
            echo "::notice::Tippet er allerede udgivet som v$V – intet nyt release."
            echo do=skip >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ $V =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::Versionen $V er ikke ren semver (X.Y.Z) – tag den manuelt, hvis du vil udgive."
            echo do=skip >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Har nogen af push'ets commits ændret versionen? Så udgives den præcist, uden bump.
          # (Ved workflow_dispatch findes github.event.push ikke – her er listen tom.)
          MANUAL=0
          for c in ${{ join((github.event.push && github.event.push.commits.*.sha) || fromJSON('[]'), ' ') }}; do
            if git diff --name-only "$c^" "$c" | grep -qx "packages/app/package.json"; then
              MANUAL=1
              break
            fi
          done

          if [ "$MANUAL" = 1 ]; then
            echo "::notice::Push'et ændrer versionen til $V – udgives uden bump."
            echo do=tag >> "$GITHUB_OUTPUT"
          else
            echo "do=bump" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch-versionen og push til main
        if: steps.decide.outputs.do == 'bump'
        run: |
          set -euo pipefail
          npm version patch --no-git-tag-version -w @miai/app
          NV=$(node -p "require('./packages/app/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/app/package.json package-lock.json
          git commit -m "chore(release): bump version til $NV"
          # Har main rykket sig undervejs, rebases vi og prøver igen.
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }

      - name: Tag og udgiv
        if: steps.decide.outputs.do != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./packages/app/package.json').version")
          git tag "v$V"
          git push origin "v$V"
          # Pushes (også tags) med GITHUB_TOKEN trigget ikke workflows – det er
          # GitHub-dokumenteret og forhindrer løkker, men betyder også, at tagget
          # ikke selv starter release-pipeline'et. Vi starter den derfor eksplicit;
          # --ref giver samme kontekst som en tag-push (github.ref = refs/tags/v$V),
          # så release.yml's tjek og publish-job kører, som de plejer.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v$V"
