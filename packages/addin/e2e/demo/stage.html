<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <title>MIAI demo</title>
    <style>
      :root {
        --ink: #1b2430;
        --muted: #5b6776;
        --line: #d9dee5;
        --canvas: #eef1f5;
        --accent: #0f6cbd;
        --ins: #0b6a3b;
        --del: #b3261e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0e1520;
      }
      body {
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        color: var(--ink);
      }
      /*
       * Scenen er tegnet i 1280×720 og forstørres 1,5 gange til 1080p. Forstørrelsen ligger på de
       * enkelte dele og ikke på hele scenen: en forstørret ramme om task pane forskyder klik i den.
       * Task pane-rammen skaleres med transform, som klik følger korrekt.
       */
      #stage {
        width: 1920px;
        height: 1080px;
        display: grid;
        grid-template-rows: 57px 1fr 81px;
        background: var(--canvas);
        position: relative;
      }
      #bar,
      #desk,
      #caption,
      #card {
        zoom: 1.5;
      }
      #bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        color: var(--muted);
      }
      #bar .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #c9d1db;
      }
      #bar b {
        color: var(--ink);
        font-weight: 600;
        margin-left: 8px;
      }
      #bar .sim {
        margin-left: auto;
        font-size: 11px;
      }
      #work {
        display: grid;
        grid-template-columns: 1fr 570px;
        min-height: 0;
      }
      #desk {
        overflow: hidden;
        padding: 22px 0 0;
        display: flex;
        justify-content: center;
      }
      #page {
        width: 720px;
        background: #fff;
        box-shadow:
          0 1px 3px rgba(16, 24, 40, 0.12),
          0 8px 24px rgba(16, 24, 40, 0.08);
        padding: 44px 60px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 14.5px;
        line-height: 1.55;
      }
      #page h1 {
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        font-size: 23px;
        line-height: 1.25;
        margin: 0 0 14px;
        font-weight: 600;
      }
      #page h2 {
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        margin: 16px 0 5px;
        font-weight: 600;
        color: #17406d;
      }
      #page p {
        margin: 0 0 10px;
      }
      #page li {
        margin: 0 0 4px;
      }
      #page table {
        border-collapse: collapse;
        width: 100%;
        margin: 6px 0 12px;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
      }
      #page td {
        border: 1px solid #c5ccd6;
        padding: 5px 9px;
      }
      #page tr:first-child td {
        background: #eaf2fb;
        font-weight: 600;
      }
      #page .new {
        animation: flash 2.2s ease-out;
      }
      @keyframes flash {
        0% {
          background: #fff3bf;
        }
        60% {
          background: #fff3bf;
        }
        100% {
          background: transparent;
        }
      }
      #page ins {
        color: var(--ins);
        text-decoration: underline;
        text-decoration-thickness: 1.5px;
        background: #e6f4ea;
      }
      #page del {
        color: var(--del);
        background: #fdecea;
      }
      #page .sel {
        background: #cfe3fb;
        box-shadow: 0 0 0 3px #cfe3fb;
      }
      /* Regnearket (Excel-scenen): et gitter tegnet ud fra den simulerede Excels tilstand. */
      #sheet {
        display: none;
        position: relative;
        align-self: flex-start;
        background: #fff;
        box-shadow:
          0 1px 3px rgba(16, 24, 40, 0.12),
          0 8px 24px rgba(16, 24, 40, 0.08);
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
      }
      #desk.sheet {
        padding-top: 16px;
      }
      #desk.sheet #page {
        display: none;
      }
      #desk.sheet #sheet {
        display: block;
      }
      #sheet table {
        border-collapse: collapse;
        table-layout: fixed;
      }
      #sheet th {
        background: #f3f5f8;
        color: var(--muted);
        font-weight: 400;
        font-size: 11.5px;
        border: 1px solid #d5dae1;
        height: 22px;
      }
      #sheet td {
        border: 1px solid #e3e7ec;
        height: 26px;
        padding: 0 8px;
        white-space: nowrap;
        overflow: hidden;
        transition:
          background-color 0.5s ease,
          color 0.5s ease;
      }
      #sheet td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #sheet td.head {
        background: #1f5fa8;
        color: #fff;
        font-weight: 600;
        border-color: #1f5fa8;
      }
      #sheet td.band {
        background: #eaf2fb;
      }
      #chart {
        position: absolute;
        background: #fff;
        border: 1px solid #cfd5dd;
        box-shadow: 0 2px 8px rgba(16, 24, 40, 0.1);
        animation: appear 0.7s ease-out;
      }
      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      #pane {
        border-left: 1px solid var(--line);
        background: #fff;
        min-height: 0;
      }
      /* Task pane er 380 px bred som i Office og skaleres op, så den ligner resten af scenen. */
      #pane {
        overflow: hidden;
      }
      #pane iframe {
        width: 380px;
        height: 628px;
        border: 0;
        display: block;
        transform: scale(1.5);
        transform-origin: 0 0;
      }
      #caption {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 18px;
        background: #101a27;
        color: #fff;
      }
      #caption .n {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: var(--accent);
        border-radius: 999px;
        padding: 3px 10px;
        white-space: nowrap;
      }
      #caption .t {
        font-size: 17px;
        font-weight: 600;
      }
      #caption .s {
        font-size: 13.5px;
        color: #b8c4d2;
      }
      #caption.swap > * {
        animation: rise 0.45s ease-out;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      #cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 33px;
        height: 33px;
        transform: translate(960px, 570px);
        transition: transform 0.6s cubic-bezier(0.3, 0.1, 0.2, 1);
        z-index: 20;
        pointer-events: none;
      }
      #ripple {
        position: absolute;
        width: 51px;
        height: 51px;
        margin: -25px 0 0 -25px;
        border-radius: 50%;
        border: 3px solid var(--accent);
        opacity: 0;
        z-index: 19;
        pointer-events: none;
      }
      #ripple.go {
        animation: ripple 0.45s ease-out;
      }
      @keyframes ripple {
        from {
          opacity: 0.9;
          transform: scale(0.3);
        }
        to {
          opacity: 0;
          transform: scale(1.2);
        }
      }
      #card {
        position: absolute;
        inset: 0;
        z-index: 30;
        background: linear-gradient(135deg, #0e1a2b 0%, #123a66 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 14px;
        transition: opacity 0.6s ease;
      }
      #card.off {
        opacity: 0;
        pointer-events: none;
      }
      #card h1 {
        font-size: 46px;
        margin: 0;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      #card p {
        font-size: 20px;
        margin: 0;
        color: #c6d6ea;
        max-width: 760px;
        line-height: 1.45;
      }
      #card .tags {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }
      #card .tags span {
        font-size: 14px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;
        padding: 5px 14px;
      }
      #card small {
        position: absolute;
        bottom: 24px;
        font-size: 14px;
        color: #b4c6dc;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <b id="docname">Dokument</b>
        <span class="sim">Simuleret dokument · indspillede modelsvar</span>
      </div>
      <div id="work">
        <div id="desk">
          <div id="page"></div>
          <div id="sheet"></div>
        </div>
        <div id="pane"><iframe id="tp" title="MIAI"></iframe></div>
      </div>
      <div id="caption"><span class="n"></span><span class="t"></span><span class="s"></span></div>
      <svg id="cursor" viewBox="0 0 22 22">
        <path d="M3 2l15 9-6.5 1.6L15 20l-3 1.3-3.4-7.3L3 18z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round" />
      </svg>
      <div id="ripple"></div>
      <div id="card">
        <h1></h1>
        <p></p>
        <div class="tags"></div>
        <small></small>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
      const state = { tracked: null, sel: [], last: "", seen: new Set(), first: true, chartShown: false };

      // Ordvis forskel (længste fælles delsekvens) til visning af sporede ændringer.
      function diff(a, b) {
        const x = a.split(/(\s+)/),
          y = b.split(/(\s+)/);
        const m = Array.from({ length: x.length + 1 }, () => new Array(y.length + 1).fill(0));
        for (let i = x.length - 1; i >= 0; i--)
          for (let j = y.length - 1; j >= 0; j--) m[i][j] = x[i] === y[j] ? m[i + 1][j + 1] + 1 : Math.max(m[i + 1][j], m[i][j + 1]);
        let i = 0,
          j = 0,
          out = "";
        while (i < x.length || j < y.length) {
          if (i < x.length && j < y.length && x[i] === y[j]) ((out += esc(x[i])), i++, j++);
          // Slettet før indsat, som sporede ændringer plejer at stå.
          else if (i < x.length && (j === y.length || m[i + 1][j] >= m[i][j + 1])) ((out += `<del>${esc(x[i])}</del>`), i++);
          else ((out += `<ins>${esc(y[j])}</ins>`), j++);
        }
        return out;
      }

      function inline(p, i) {
        if (state.tracked && state.tracked[i] !== undefined && state.tracked[i] !== p.text) return diff(state.tracked[i], p.text);
        return state.sel.includes(p.text) ? `<span class="sel">${esc(p.text)}</span>` : esc(p.text);
      }

      function render(paras) {
        let html = "",
          i = 0;
        // Nyt og ændret blinker kort – undtagen sporede ændringer, som allerede er markeret.
        const cls = (p) => (!state.first && !state.tracked && !state.seen.has(p.text) ? ' class="new"' : "");
        while (i < paras.length) {
          const p = paras[i];
          if (p.cell) {
            const t = p.cell.t;
            const rows = new Map();
            let fresh = false;
            for (; i < paras.length && paras[i].cell && paras[i].cell.t === t; i++) {
              const c = paras[i];
              if (!state.first && !state.seen.has(c.text)) fresh = true;
              if (!rows.has(c.cell.row)) rows.set(c.cell.row, []);
              rows.get(c.cell.row).push(`<td>${inline(c, i)}</td>`);
            }
            html += `<table${fresh ? ' class="new"' : ""}>${[...rows.values()].map((r) => `<tr>${r.join("")}</tr>`).join("")}</table>`;
            continue;
          }
          const tag = /Heading1|Title/.test(p.style) ? "h1" : /Heading[23]/.test(p.style) ? "h2" : "p";
          if (/^List/.test(p.style) || p.list) html += `<p${cls(p)} style="padding-left:22px;text-indent:-14px">• ${inline(p, i)}</p>`;
          else html += `<${tag}${cls(p)}>${p.bold ? "<b>" : ""}${inline(p, i)}${p.bold ? "</b>" : ""}</${tag}>`;
          i++;
        }
        $("page").innerHTML = html;
        state.first = false;
        for (const p of paras) state.seen.add(p.text);
      }

      // --- Regneark -----------------------------------------------------------------------------
      const COLS = ["A", "B", "C", "D", "E", "F", "G", "H", "I"];
      const WIDTH = { A: 150, B: 124, C: 124 };
      const ROWS = 20;
      const HEAD = 36,
        COLW = 72,
        HEADH = 23,
        ROWH = 27;
      const colIndex = (l) => COLS.indexOf(l);
      /** "Ark!B2:C8" eller "B2" → { c0, r0, c1, r1 } (0 = første). */
      function parseRange(a) {
        const m = /^(?:.*!)?([A-Z]+)(\d+)(?::([A-Z]+)(\d+))?$/.exec(a.replace(/\$/g, ""));
        if (!m) return null;
        return { c0: colIndex(m[1]), r0: +m[2] - 1, c1: colIndex(m[3] || m[1]), r1: +(m[4] || m[2]) - 1 };
      }
      const inside = (g, r, c) => g && r >= g.r0 && r <= g.r1 && c >= g.c0 && c <= g.c1;
      const num = (v) => new Intl.NumberFormat("da-DK").format(v);
      /** Viser et tal efter Excels formatkode – kun de former, demoen bruger. */
      function show(v, f) {
        if (typeof v !== "number") return esc(String(v));
        if (!f || f === "General") return String(v);
        if (f.includes("%")) return num(Math.round(v * 100)) + " %";
        // Det, der står efter sidste cifferplads, er en endelse som " kr.".
        const tail = f.slice(Math.max(f.lastIndexOf("0"), f.lastIndexOf("#")) + 1).replace(/"/g, "");
        return (f.includes(",") ? num(v) : String(v)) + esc(tail);
      }

      /** Søjlediagram af første (kategori) og anden (værdi) kolonne i kildeområdet. */
      function chartSvg(sheet, chart) {
        const g = parseRange(chart.source);
        if (!g) return "";
        const rows = [];
        for (let r = g.r0 + 1; r <= g.r1; r++) {
          const v = sheet.values[r] && sheet.values[r][g.c0 + 1];
          if (typeof v === "number") rows.push([String(sheet.values[r][g.c0]), v]);
        }
        const W = 372,
          H = 286,
          L = 54,
          R = 12,
          T = 44,
          B = 30;
        const pw = W - L - R,
          ph = H - T - B;
        const step = [50000, 100000, 200000, 250000, 500000].find((x) => Math.max(...rows.map((d) => d[1])) / x <= 4) || 1000000;
        const top = Math.ceil(Math.max(...rows.map((d) => d[1])) / step) * step;
        const y = (v) => T + ph - (v / top) * ph;
        const slot = pw / rows.length,
          bw = Math.min(24, slot * 0.5);
        const max = Math.max(...rows.map((d) => d[1]));
        let out = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">`;
        out += `<text x="14" y="24" font-size="13.5" font-weight="600" fill="#1b2430">${esc(chart.title || "Diagram")}</text>`;
        for (let v = 0; v <= top; v += step) {
          out += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? "#e8ebf0" : "#aab3bf"}" />`;
          out += `<text x="${L - 7}" y="${y(v) + 3.5}" font-size="10" text-anchor="end" fill="#5b6776">${num(v)}</text>`;
        }
        rows.forEach(([name, v], i) => {
          const x = L + slot * i + (slot - bw) / 2,
            yy = y(v),
            h = T + ph - yy,
            rad = Math.min(4, h);
          // Afrundet top, lige bund ved grundlinjen.
          out += `<path d="M${x},${yy + h}V${yy + rad}a${rad},${rad} 0 0 1 ${rad},-${rad}h${bw - 2 * rad}a${rad},${rad} 0 0 1 ${rad},${rad}V${yy + h}z" fill="#2a78d6" />`;
          if (v === max) out += `<text x="${x + bw / 2}" y="${yy - 6}" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1b2430">${num(v)}</text>`;
          out += `<text x="${x + bw / 2}" y="${H - 11}" font-size="10" text-anchor="middle" fill="#5b6776">${esc(name)}</text>`;
        });
        return out + "</svg>";
      }

      function renderSheet(sheet) {
        const tables = sheet.tables.map((t) => ({ ...t, g: parseRange(t.range) }));
        const bars = sheet.conditionalFormats.filter((c) => /DataBar/i.test(c.type)).map((c) => parseRange(c.address));
        const barMax = bars.map((g) => {
          let m = 0;
          for (let r = g.r0; r <= g.r1; r++)
            for (let c = g.c0; c <= g.c1; c++) if (typeof (sheet.values[r] || [])[c] === "number") m = Math.max(m, sheet.values[r][c]);
          return m;
        });
        let html = `<table><colgroup><col style="width:${HEAD}px">${COLS.map((l) => `<col style="width:${WIDTH[l] || COLW}px">`).join("")}</colgroup>`;
        html += `<tr><th></th>${COLS.map((l) => `<th>${l}</th>`).join("")}</tr>`;
        for (let r = 0; r < ROWS; r++) {
          html += `<tr><th>${r + 1}</th>`;
          COLS.forEach((l, c) => {
            const v = (sheet.values[r] || [])[c];
            const f = sheet.formats[l + (r + 1)] || {};
            const t = tables.find((x) => x.style && inside(x.g, r, c));
            const cls = [typeof v === "number" ? "num" : "", t ? (r === t.g.r0 ? "head" : (r - t.g.r0) % 2 ? "band" : "") : ""].filter(Boolean).join(" ");
            let style = f.bold && !t ? "font-weight:600;" : "";
            const b = bars.findIndex((g) => inside(g, r, c));
            if (b >= 0 && typeof v === "number" && barMax[b]) {
              const pct = Math.max(4, Math.round((v / barMax[b]) * 100));
              style += `background-image:linear-gradient(to right, rgba(42,120,214,.30) ${pct}%, transparent ${pct}%);`;
            }
            html += `<td class="${cls}" style="${style}">${v === undefined || v === "" ? "" : show(v, f.numberFormat)}</td>`;
          });
          html += "</tr>";
        }
        html += "</table>";
        for (const ch of sheet.charts) {
          const at = parseRange(ch.at || "E1") || { c0: 4, r0: 0 };
          const left = HEAD + COLS.slice(0, at.c0).reduce((n, l) => n + (WIDTH[l] || COLW), 0) + 14;
          html += `<div id="chart" style="left:${left}px;top:${HEADH + (at.r0 + 1) * ROWH}px">${chartSvg(sheet, ch)}</div>`;
        }
        $("sheet").innerHTML = html;
        // Diagrammet toner kun ind første gang; senere gentegninger (fx når rækker slettes) er rolige.
        const chart = $("chart");
        if (chart && state.chartShown) chart.style.animation = "none";
        state.chartShown = !!chart;
      }

      setInterval(() => {
        const api = $("tp").contentWindow && $("tp").contentWindow.__miai;
        if (!api) return;
        // Excel-scenen: den simulerede Excel har et ark, den simulerede Word har afsnit.
        if (api.sheet) {
          const sheet = api.sheet();
          const key = JSON.stringify(sheet);
          if (key === state.last) return;
          state.last = key;
          $("desk").classList.add("sheet");
          return renderSheet(sheet);
        }
        if (!api.doc) return;
        $("desk").classList.remove("sheet");
        const paras = api.doc();
        const key = JSON.stringify([paras, state.sel, !!state.tracked]);
        if (key === state.last) return;
        state.last = key;
        render(paras);
      }, 100);

      window.stage = {
        open(url, docname) {
          $("docname").textContent = docname;
          $("tp").src = url;
        },
        caption(n, t, s) {
          const c = $("caption");
          c.querySelector(".n").textContent = n;
          c.querySelector(".t").textContent = t;
          c.querySelector(".s").textContent = s || "";
          c.classList.remove("swap");
          void c.offsetWidth;
          c.classList.add("swap");
        },
        /** Fra nu af vises ændringer i afsnittene som sporede ændringer (indsat/slettet). */
        track(on) {
          const api = $("tp").contentWindow.__miai;
          state.tracked = on ? api.doc().map((p) => p.text) : null;
        },
        /** Markerer de afsnit, der har disse tekster (tom liste = ingen markering), også i den simulerede Word. */
        select(texts) {
          state.sel = texts;
          $("tp").contentWindow.__miai.selectText(texts.join("\n"));
        },
        cursor(x, y) {
          $("cursor").style.transform = `translate(${x}px, ${y}px)`;
        },
        ripple(x, y) {
          const r = $("ripple");
          r.style.left = x + "px";
          r.style.top = y + "px";
          r.classList.remove("go");
          void r.offsetWidth;
          r.classList.add("go");
        },
        card(title, text, tags, small) {
          const c = $("card");
          if (!title) return c.classList.add("off");
          c.querySelector("h1").textContent = title;
          c.querySelector("p").textContent = text || "";
          c.querySelector(".tags").innerHTML = (tags || []).map((t) => `<span>${esc(t)}</span>`).join("");
          c.querySelector("small").textContent = small || "";
          c.classList.remove("off");
        },
      };
    </script>
  </body>
</html>
